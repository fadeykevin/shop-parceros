name: Django CI/CD - Shop Parceros

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.11'
  DJANGO_VERSION: '5.1'

jobs:
  # ============================================
  # JOB 1: LINTING Y CALIDAD DE CÓDIGO
  # ============================================
  lint:
    name: 🔍 Análisis de Código
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
      
      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Cache de dependencias
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Instalar herramientas de linting
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint black isort
      
      - name: Ejecutar Flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Verificar formato con Black
        run: |
          black --check --diff .
        continue-on-error: true
      
      - name: Verificar imports con isort
        run: |
          isort --check-only --diff .
        continue-on-error: true

  # ============================================
  # JOB 2: PRUEBAS UNITARIAS Y DE INTEGRACIÓN
  # ============================================
  test:
    name: 🧪 Pruebas Automatizadas
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
      
      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install django==${{ env.DJANGO_VERSION }}
          pip install djangorestframework djangorestframework-simplejwt
          pip install drf-yasg django-debug-toolbar pillow
          pip install django-cors-headers
          pip install coverage pytest pytest-django
      
      - name: Crear base de datos de pruebas
        run: |
          python manage.py makemigrations
          python manage.py migrate --noinput
      
      - name: Ejecutar pruebas con cobertura
        run: |
          coverage run --source='.' manage.py test --verbosity=2
          coverage report --skip-covered
          coverage html
      
      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 7

  # ============================================
  # JOB 3: ANÁLISIS DE SEGURIDAD
  # ============================================
  security:
    name: 🔒 Análisis de Seguridad
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Instalar herramientas de seguridad
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
      
      - name: Ejecutar Bandit (análisis de seguridad)
        run: |
          bandit -r . -f json -o bandit-report.json || true
          bandit -r . -ll
        continue-on-error: true
      
      - name: Verificar vulnerabilidades en dependencias
        run: |
          pip install django djangorestframework djangorestframework-simplejwt
          safety check --json || true
        continue-on-error: true
      
      - name: Subir reporte de seguridad
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: bandit-report.json
          retention-days: 7

  # ============================================
  # JOB 4: BUILD Y VALIDACIÓN
  # ============================================
  build:
    name: 🏗️ Build del Proyecto
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install django==${{ env.DJANGO_VERSION }}
          pip install djangorestframework djangorestframework-simplejwt
          pip install drf-yasg django-debug-toolbar pillow django-cors-headers
      
      - name: Recolectar archivos estáticos
        run: |
          python manage.py collectstatic --noinput
        continue-on-error: true
      
      - name: Verificar configuración
        run: |
          python manage.py check --deploy
      
      - name: Crear artifact del proyecto
        run: |
          mkdir -p build
          cp -r . build/
      
      - name: Subir build
        uses: actions/upload-artifact@v3
        with:
          name: django-build
          path: build/
          retention-days: 7

  # ============================================
  # JOB 5: DEPLOYMENT (solo en main)
  # ============================================
  deploy:
    name: 🚀 Despliegue a Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
      
      - name: Descargar build
        uses: actions/download-artifact@v3
        with:
          name: django-build
      
      - name: Simular despliegue
        run: |
          echo "🚀 Desplegando Shop Parceros..."
          echo "✅ Build verificado"
          echo "✅ Pruebas pasadas"
          echo "✅ Seguridad validada"
          echo "📦 Versión: ${{ github.sha }}"
          echo "🌐 Ambiente: Staging"
      
      - name: Crear tag de release
        if: success()
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          VERSION="v1.0.${{ github.run_number }}"
          echo "📌 Creando tag: $VERSION"

  # ============================================
  # JOB 6: NOTIFICACIÓN DE RESULTADOS
  # ============================================
  notify:
    name: 📢 Notificación
    runs-on: ubuntu-latest
    needs: [lint, test, security, build]
    if: always()
    steps:
      - name: Resultado del Pipeline
        run: |
          echo "================================================"
          echo "🎯 PIPELINE CI/CD - SHOP PARCEROS"
          echo "================================================"
          echo "📊 Lint: ${{ needs.lint.result }}"
          echo "🧪 Tests: ${{ needs.test.result }}"
          echo "🔒 Security: ${{ needs.security.result }}"
          echo "🏗️  Build: ${{ needs.build.result }}"
          echo "================================================"
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "✅ PIPELINE EXITOSO"
          else
            echo "❌ PIPELINE FALLÓ"
            exit 1
          fi